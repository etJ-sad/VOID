# CPU Stress Test - Cache Stress
# Category: CPU > Stress
# Stress tests CPU cache hierarchy

tests:
  - id: cpu_stress_cache
    name: CPU Stress Test - Cache Hierarchy
    category: CPU
    description: "Stress tests CPU cache hierarchy with various access patterns"
    duration_estimate: 1200  # 20 minutes
    priority: 7
    test_type: stress
    preconditions:
      - "CPU detected"
      - "Cache hierarchy available"
    parameters:
      duration: 90
      cache_levels: ["L1", "L2", "L3"]
      access_patterns: ["sequential", "random", "strided"]
      data_size_mb: 100
      monitor_cache_misses: true
      collect_temperature: true
    thresholds:
      max_cache_miss_rate: 0.5
      max_temperature_celsius: 80
    baseline:
      expected_l1_hit_rate: 0.95
      expected_l2_hit_rate: 0.85

