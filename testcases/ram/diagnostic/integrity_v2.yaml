# RAM Diagnostic - Memory Integrity v2
# Category: RAM > Diagnostic
# Tests RAM integrity

tests:
  - id: ram_diagnostic_integrity_v2
    name: RAM Diagnostic - Memory Integrity v2
    category: RAM
    description: "Tests RAM integrity and error detection"
    duration_estimate: 1800  # 30 minutes
    priority: 8
    test_type: diagnostic
    preconditions:
      - "RAM detected"
    parameters:
      duration: 120
      test_patterns: ["all_zeros", "all_ones", "checkerboard"]
    thresholds:
      no_errors: true
      integrity_score_min: 99
    baseline:
      expected_integrity: 100

