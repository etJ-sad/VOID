# RAM Diagnostic - Memory Timing
# Category: RAM > Diagnostic
# Collects RAM timing information

tests:
  - id: ram_diagnostic_memory_timing
    name: RAM Diagnostic - Memory Timing
    category: RAM
    description: "Collects detailed RAM timing information"
    duration_estimate: 300  # 5 minutes
    priority: 7
    test_type: diagnostic
    preconditions:
      - "RAM detected"
      - "System information accessible"
    parameters:
      duration: 30
      measure_timings: true
      collect_all_timing_data: true
      test_frequencies: true
    thresholds:
      min_timing_data_points: 10
    baseline:
      expected_cas_latency: 16
      expected_timing_accuracy: 0.95

