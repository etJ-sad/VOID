# RAM Stress Test - Fragmentation
# Category: RAM > Stress
# Stress tests RAM fragmentation

tests:
  - id: ram_stress_fragmentation
    name: RAM Stress Test - Memory Fragmentation
    category: RAM
    description: "Stress tests RAM with memory fragmentation patterns"
    duration_estimate: 1500  # 25 minutes
    priority: 7
    test_type: stress
    preconditions:
      - "RAM detected"
      - "Sufficient memory available"
    parameters:
      duration: 100
      allocation_sizes: [1, 4, 16, 64, 256]
      fragmentation_level: "high"
      monitor_fragmentation: true
      collect_statistics: true
    thresholds:
      max_fragmentation_ratio: 0.5
    baseline:
      expected_fragmentation_ratio: 0.2

