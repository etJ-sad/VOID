# RAM Bandwidth Test - Sequential & Random v2
# Category: RAM > Benchmark
# Tests RAM bandwidth with sequential and random access

tests:
  - id: ram_benchmark_bandwidth_v2
    name: RAM Bandwidth Test - Sequential & Random v2
    category: RAM
    description: "Benchmarks RAM bandwidth with sequential and random access patterns"
    duration_estimate: 900  # 15 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "RAM detected"
    parameters:
      duration: 60
      access_patterns: ["sequential", "random"]
      block_size_mb: 100
    thresholds:
      min_bandwidth_gbps: 10
    baseline:
      expected_sequential_gbps: 20
      expected_random_gbps: 15

