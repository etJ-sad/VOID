# RAM Benchmark - Latency Test
# Category: RAM > Benchmark
# Tests RAM access latency

tests:
  - id: ram_benchmark_latency_test
    name: RAM Benchmark - Access Latency
    category: RAM
    description: "Measures RAM access latency for different access patterns"
    duration_estimate: 600  # 10 minutes
    priority: 8
    test_type: benchmark
    preconditions:
      - "RAM detected"
      - "Sufficient memory available"
    parameters:
      duration: 45
      access_patterns: ["sequential", "random", "strided"]
      data_size_mb: 100
      iterations: 1000
    thresholds:
      max_latency_ns: 100
    baseline:
      expected_sequential_latency_ns: 50
      expected_random_latency_ns: 80

