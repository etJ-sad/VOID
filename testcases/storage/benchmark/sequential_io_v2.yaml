# Storage Sequential I/O Benchmark v2
# Category: Storage > Benchmark
# Tests sequential I/O performance

tests:
  - id: storage_benchmark_sequential_io_v2
    name: Storage Sequential I/O Benchmark v2
    category: Storage
    description: "Benchmarks storage sequential read/write performance"
    duration_estimate: 600  # 10 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "Storage detected"
    parameters:
      duration: 30
      block_size_mb: 100
      operations: ["read", "write"]
    thresholds:
      min_read_mbps: 100
      min_write_mbps: 50
    baseline:
      expected_read_mbps: 500
      expected_write_mbps: 300

