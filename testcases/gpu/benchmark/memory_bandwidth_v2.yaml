# GPU Benchmark - Memory Bandwidth v2
# Category: GPU > Benchmark
# Tests GPU memory bandwidth

tests:
  - id: gpu_benchmark_memory_bandwidth_v2
    name: GPU Benchmark - Memory Bandwidth v2
    category: GPU
    description: "Benchmarks GPU memory bandwidth"
    duration_estimate: 600  # 10 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "GPU detected"
    parameters:
      duration: 30
      access_pattern: "coalesced"
    thresholds:
      min_bandwidth_gbps: 50
    baseline:
      expected_bandwidth_gbps: 200

