# System Performance Test - Responsiveness v2
# Category: System > Performance
# Tests system responsiveness

tests:
  - id: system_performance_responsiveness_v2
    name: System Performance Test - Responsiveness v2
    category: System
    description: "Tests system responsiveness under various loads"
    duration_estimate: 600  # 10 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "System accessible"
    parameters:
      duration: 30
      load_levels: [0, 50, 100]
    thresholds:
      max_response_time_ms: 100
    baseline:
      expected_response_time_ms: 50

