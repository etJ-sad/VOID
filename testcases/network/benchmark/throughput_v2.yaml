# Network Throughput Benchmark v2
# Category: Network > Benchmark
# Tests network throughput

tests:
  - id: network_benchmark_throughput_v2
    name: Network Throughput Benchmark v2
    category: Network
    description: "Benchmarks network throughput"
    duration_estimate: 600  # 10 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "Network interface detected"
      - "Network connectivity"
    parameters:
      duration: 60
      direction: "bidirectional"
    thresholds:
      min_throughput_mbps: 100
    baseline:
      expected_throughput_mbps: 1000

