# Network Benchmark - Latency v2
# Category: Network > Benchmark
# Tests network latency

tests:
  - id: network_benchmark_latency_v2
    name: Network Benchmark - Latency v2
    category: Network
    description: "Benchmarks network latency characteristics"
    duration_estimate: 300  # 5 minutes
    priority: 7
    test_type: benchmark
    preconditions:
      - "Network interface detected"
      - "Network connectivity"
    parameters:
      duration: 30
      packet_count: 1000
      target_host: "8.8.8.8"
    thresholds:
      max_latency_ms: 100
    baseline:
      expected_avg_latency_ms: 20

