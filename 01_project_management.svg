<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00ACC1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
        </linearGradient>
        <filter id="elevation2">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.2"/>
        </filter>
        <filter id="elevation4">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.24"/>
        </filter>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#00ACC1"/>
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="480" fill="#FAFAFA"/>
    
    <!-- Header -->
    <text x="24" y="40" font-family="Roboto, sans-serif" font-size="28" font-weight="300" fill="#212121">Project Management</text>
    <rect x="24" y="52" width="80" height="3" fill="url(#primaryGrad)"/>
    
    <!-- Main Content Card -->
    <rect x="24" y="80" width="1152" height="280" fill="#FFFFFF" rx="4" filter="url(#elevation2)"/>
    
    <!-- Left Section -->
    <text x="48" y="116" font-family="Roboto, sans-serif" font-size="14" font-weight="500" fill="#757575">DEPLOYMENT</text>
    <rect x="48" y="128" width="480" height="1" fill="#E0E0E0"/>
    
    <text x="48" y="152" font-family="Roboto, sans-serif" font-size="14" fill="#424242">WIM Image Deployment</text>
    <text x="48" y="176" font-family="Roboto, sans-serif" font-size="14" fill="#424242">IPC Model Selection</text>
    <text x="48" y="200" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Test Schedule Planning</text>
    <text x="48" y="224" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Multi-IPC Coordination</text>
    <text x="48" y="248" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Change Management</text>
    
    <rect x="28" y="140" width="4" height="120" fill="#1976D2" rx="2"/>
    
    <!-- Right Section -->
    <text x="580" y="116" font-family="Roboto, sans-serif" font-size="14" font-weight="500" fill="#757575">CONFIGURATION</text>
    <rect x="580" y="128" width="480" height="1" fill="#E0E0E0"/>
    
    <text x="580" y="152" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Test Configuration Management</text>
    <text x="580" y="176" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Baseline Management</text>
    <text x="580" y="200" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Resource Allocation</text>
    <text x="580" y="224" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Report Distribution</text>
    <text x="580" y="248" font-family="Roboto, sans-serif" font-size="14" fill="#424242">Security Compliance</text>
    
    <rect x="560" y="140" width="4" height="120" fill="#00ACC1" rx="2"/>
    
    <!-- Stats Section -->
    <rect x="48" y="280" width="230" height="64" fill="#F5F5F5" rx="4"/>
    <text x="68" y="304" font-family="Roboto, sans-serif" font-size="12" font-weight="500" fill="#757575">SCALABILITY</text>
    <text x="68" y="325" font-family="Roboto, sans-serif" font-size="18" font-weight="400" fill="#1976D2">Multiple IPCs</text>
    <text x="68" y="338" font-family="Roboto, sans-serif" font-size="11" fill="#9E9E9E">Simultaneously</text>
    
    <rect x="298" y="280" width="230" height="64" fill="#F5F5F5" rx="4"/>
    <text x="318" y="304" font-family="Roboto, sans-serif" font-size="12" font-weight="500" fill="#757575">RELIABILITY</text>
    <text x="318" y="325" font-family="Roboto, sans-serif" font-size="18" font-weight="400" fill="#4CAF50">High Success</text>
    <text x="318" y="338" font-family="Roboto, sans-serif" font-size="11" fill="#9E9E9E">Rate Goal</text>
    
    <rect x="548" y="280" width="230" height="64" fill="#F5F5F5" rx="4"/>
    <text x="568" y="304" font-family="Roboto, sans-serif" font-size="12" font-weight="500" fill="#757575">SPEED</text>
    <text x="568" y="325" font-family="Roboto, sans-serif" font-size="18" font-weight="400" fill="#00ACC1">Under 48h</text>
    <text x="568" y="338" font-family="Roboto, sans-serif" font-size="11" fill="#9E9E9E">Per Test Cycle</text>
    
    <rect x="798" y="280" width="230" height="64" fill="#F5F5F5" rx="4"/>
    <text x="818" y="304" font-family="Roboto, sans-serif" font-size="12" font-weight="500" fill="#757575">OPERATION</text>
    <text x="818" y="325" font-family="Roboto, sans-serif" font-size="18" font-weight="400" fill="#1976D2">Continuous</text>
    <text x="818" y="338" font-family="Roboto, sans-serif" font-size="11" fill="#9E9E9E">24/7 Testing</text>
    
    <!-- Bottom Cards -->
    <rect x="24" y="380" width="560" height="76" fill="#FFFFFF" rx="4" filter="url(#elevation2)"/>
    <rect x="24" y="380" width="560" height="4" fill="url(#primaryGrad)" rx="4"/>
    <text x="48" y="412" font-family="Roboto, sans-serif" font-size="16" font-weight="500" fill="#212121">Configuration Management</text>
    <text x="48" y="436" font-family="Roboto, sans-serif" font-size="13" fill="#757575">Test profiles, baseline control, hardware database</text>
    
    <rect x="616" y="380" width="560" height="76" fill="#FFFFFF" rx="4" filter="url(#elevation2)"/>
    <rect x="616" y="380" width="560" height="4" fill="url(#accentGrad)" rx="4"/>
    <text x="640" y="412" font-family="Roboto, sans-serif" font-size="16" font-weight="500" fill="#212121">Test Execution Management</text>
    <text x="640" y="436" font-family="Roboto, sans-serif" font-size="13" fill="#757575">Parallel orchestration, queue management, progress tracking</text>
    
    <!-- Connection -->
    <path d="M584,418 L616,418" stroke="#00ACC1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M616,418 L584,418" stroke="#00ACC1" stroke-width="2" marker-start="url(#arrow)"/>
</svg>