    <text x="92" y="300" font-family="Roboto Mono, monospace" font-size="11" fill="#64B5F6">  "version":</text>
    <text x="200" y="300" font-family="Roboto Mono, monospace" font-size="11" fill="#FFF59D">"2.3.1"</text>
    <text x="92" y="320" font-family="Roboto Mono, monospace" font-size="11" fill="#64B5F6">  "score":</text>
