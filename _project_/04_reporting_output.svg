<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="jsonGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="htmlGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00897B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00695C;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="pdfGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#E53935;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
        </linearGradient>
        <filter id="elevation2_4">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.2"/>
        </filter>
        <filter id="elevation4_4">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.24"/>
        </filter>
    </defs>
    
    <rect width="1400" height="600" fill="#FAFAFA"/>
    
