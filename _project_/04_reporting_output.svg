    <text x="92" y="340" font-family="Roboto Mono, monospace" font-size="11" fill="#64B5F6">  "status":</text>
    <text x="200" y="340" font-family="Roboto Mono, monospace" font-size="11" fill="#FFF59D">"PASS"</text>
    <text x="92" y="360" font-family="Roboto Mono, monospace" font-size="11" fill="#64B5F6">  "tests":</text>
