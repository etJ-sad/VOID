    <text x="660" y="488" font-family="Roboto, sans-serif" font-size="13" fill="#424242">Coverage: 98.4%</text>
    <text x="880" y="488" font-family="Roboto, sans-serif" font-size="13" fill="#424242">Anomalies: 12</text>
    <text x="1080" y="488" font-family="Roboto, sans-serif" font-size="13" fill="#424242">Confidence: 98.7%</text>
    
